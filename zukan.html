<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英霊図鑑</title>
<meta name="description" content="7分の1の聖杯戦争に登場する英霊を、クラスごとに並べた図鑑。解説・人物・スキル・宝具・因縁・セリフを読める。">
<meta name="theme-color" content="#050d22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 色と書体はゲーム（index.html）・強さランキングにそろえる */
:root {
  --void: #050d22;
  --panel-a: rgba(14, 44, 104, .80); --panel-b: rgba(6, 22, 58, .90); --inset: rgba(3, 14, 38, .72);
  --line: rgba(80, 196, 255, .30); --line-hi: rgba(110, 226, 255, .85);
  --cyan: #3ee6ff; --cyan-2: #8ff4ff; --ice: #e8f7ff; --mute: #8daed4; --gold: #ffd84a; --seal: #ff4f72;
  --sel-ink: #04152e;
  --en: "Rajdhani", "Zen Kaku Gothic New", sans-serif;
  --mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ice); font: 14px/1.7 var(--gothic);
  background:
    repeating-linear-gradient(0deg, rgba(62, 230, 255, .04) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(90deg, rgba(62, 230, 255, .04) 0 1px, transparent 1px 48px),
    radial-gradient(1100px 620px at 78% -8%, #15367a 0%, transparent 62%),
    var(--void);
  background-attachment: fixed;
}
body.dlg-on { overflow: hidden; }
a { color: var(--cyan); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 48px; }
header h1 { font: 700 26px/1.3 var(--mincho); margin: 0; letter-spacing: .06em; }
header .en { font-family: var(--en); letter-spacing: .2em; color: var(--cyan); font-size: 13px; text-transform: uppercase; }
header p { color: var(--mute); margin: 6px 0 0; font-size: 13px; }
.warn { margin: 14px 0; border: 1px solid rgba(255, 79, 114, .5); background: rgba(255, 79, 114, .08); padding: 10px 12px; font-size: 13px; }
.panel { position: relative; background: linear-gradient(180deg, var(--panel-a), var(--panel-b)); border: 1px solid var(--line); padding: 12px 14px; min-width: 0; }
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
.status { color: var(--mute); font-size: 12px; margin: 0 0 8px; }
.note { margin: 14px 0; border: 1px solid var(--line); background: var(--inset); padding: 10px 12px; font-size: 13px; }
.note b { color: var(--gold); font: 700 15px var(--en); }
/* 探す道具（クラスの見出し・検索・並べ替え）は、一覧を動かしても上に残す */
.bar2 { position: sticky; top: 0; z-index: 5; margin: 10px -16px 12px; padding: 6px 16px 8px; background: linear-gradient(180deg, rgba(5, 13, 34, .97), rgba(5, 13, 34, .90)); border-bottom: 1px solid var(--line); }
/* クラスの見出し（狭い画面では横に動かす） */
.tabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 8px; scrollbar-width: thin; }
.tab { flex: none; display: flex; align-items: center; gap: 6px; background: var(--inset); border: 1px solid var(--line); padding: 5px 12px 5px 8px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.tab img { width: 22px; height: 22px; }
.tab .n { font: 600 12px/1 var(--en); color: var(--mute); }
.tab[aria-selected="true"] { background: linear-gradient(90deg, var(--cyan), var(--cyan-2)); color: var(--sel-ink); border-color: var(--cyan); font-weight: 700; }
.tab[aria-selected="true"] .n { color: var(--sel-ink); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input[type=search] { flex: 1 1 220px; min-width: 0; background: var(--inset); border: 1px solid var(--line); padding: 7px 10px; }
.tools select { background: var(--inset); border: 1px solid var(--line); padding: 7px 8px; max-width: 100%; }
.tools label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; }
.tools .cnt { color: var(--mute); font-size: 12px; margin-left: auto; white-space: nowrap; }
.hint { color: var(--mute); font-size: 12px; margin: 0 0 8px; }
/* 一覧 */
.sec-h { font: 700 17px/1.4 var(--mincho); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; letter-spacing: .06em; }
.sec-h img { width: 26px; height: 26px; }
.sec-h .n { font: 600 13px/1 var(--en); color: var(--mute); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.card { display: flex; align-items: center; gap: 10px; text-align: left; background: linear-gradient(180deg, rgba(14, 44, 104, .55), rgba(6, 22, 58, .75)); border: 1px solid var(--line); padding: 8px 10px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--line-hi); background: linear-gradient(180deg, rgba(30, 70, 140, .7), rgba(8, 30, 74, .85)); }
.card .pic { flex: none; width: 56px; height: 56px; display: grid; place-items: center; background: rgba(3, 14, 38, .8); border: 1px solid rgba(80, 196, 255, .2); overflow: hidden; }
.card .pic img { width: 32px; height: 32px; opacity: .8; }
.card .pic img.face { width: 100%; height: 100%; object-fit: cover; opacity: 1; }
.card .tx { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
.card .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .s { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 一覧の札に添える六つの能力値（文字だけ。EX は金） */
.mini { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; margin-top: 4px; max-width: 150px; }
.mini i { font: 700 11px/1.5 var(--en); font-style: normal; text-align: center; color: var(--cyan-2); background: rgba(3, 14, 38, .7); }
.mini i[data-r="EX"] { color: var(--gold); }
.mini i[data-r="-"] { color: var(--mute); }
.card.lock { cursor: default; border-style: dashed; background: rgba(3, 14, 38, .5); color: var(--mute); }
.card.lock:hover { border-color: var(--line); background: rgba(3, 14, 38, .5); }
.card.lock .pic img { opacity: .35; }
.card.lock .t { font-family: var(--en); letter-spacing: .2em; }
.empty { color: var(--mute); padding: 20px 0; }
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; } .card { padding: 6px 8px; gap: 8px; } .card .pic { width: 44px; height: 44px; } header h1 { font-size: 22px; }
  /* 狭い画面では長い真名を2行まで出す */
  .card .t { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; font-size: 13px; }
  .tools .cnt { margin-left: 0; }
}
/* 詳しい内容（重ねて開く。狭い画面では全面） */
.dlg { position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-start; justify-content: center; background: rgba(2, 8, 22, .78); padding: 0 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.dlg.on { display: flex; }
.dlg .sheet { background: linear-gradient(180deg, #0c2860, #061636); }
.sheet { width: min(1080px, 100%); margin: 4vh 0; padding: 0 20px 24px; }   /* 余白は .dlg ではなくここに取る（上の帯が画面の上端に付くように） */
/* 上に残る帯：前後の英霊・閉じる・節への移動 */
.dbar { position: sticky; top: 0; z-index: 3; margin: 0 -20px 14px; padding: 8px 20px 0; background: linear-gradient(180deg, #0c2860 70%, rgba(12, 40, 96, .94)); border-bottom: 1px solid var(--line); }
.dbar .row { display: flex; align-items: center; gap: 8px; }
.dbar .pos { font: 600 13px/1 var(--en); color: var(--mute); white-space: nowrap; }
.dbar .who { flex: 1; min-width: 0; font: 700 14px/1.3 var(--mincho); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0; transition: opacity .15s; }
.dbar.stuck .who { opacity: 1; }
.dbar .close { flex: none; background: var(--inset); border: 1px solid var(--line); width: 34px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; }
.btn { --cut: 8px; display: inline-flex; align-items: center; background: linear-gradient(180deg, rgba(20, 60, 130, .9), rgba(8, 30, 74, .95)); border: 0; padding: 6px 14px; min-height: 34px; cursor: pointer; font-size: 13px; color: var(--ice); text-decoration: none;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); box-shadow: inset 0 0 0 1px var(--line-hi); }
.btn:hover { background: linear-gradient(180deg, rgba(40, 100, 180, .95), rgba(12, 44, 100, .95)); }
.btn:disabled { opacity: .35; cursor: default; }
.dbar .nv { flex: none; white-space: nowrap; }
.secnav { display: flex; gap: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-top: 6px; }
.secnav::-webkit-scrollbar { display: none; }
.secnav button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--mute); white-space: nowrap; }
.secnav button:hover { color: var(--ice); }
.secnav button[aria-current="true"] { color: var(--cyan); border-bottom-color: var(--cyan); font-weight: 700; }
/* 広い画面では、左に顔と能力値、右に本文 */
.dgrid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }
.side { position: sticky; top: 100px; max-height: calc(100vh - 116px); overflow-y: auto; scrollbar-width: thin; min-width: 0; }
.side .pic { width: 100%; aspect-ratio: 1; display: grid; place-items: center; background: rgba(3, 14, 38, .8); border: 1px solid var(--line); overflow: hidden; }
.side .pic img { width: 96px; height: 96px; opacity: .85; }
.side .pic img.face { width: 100%; height: 100%; object-fit: cover; opacity: 1; }
.side .cl { color: var(--cyan); font-size: 13px; letter-spacing: .1em; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
.side .cl img { width: 20px; height: 20px; }
.side h2 { font: 700 24px/1.35 var(--mincho); margin: 2px 0 4px; letter-spacing: .04em; overflow-wrap: anywhere; }
.side .al { color: var(--mute); font-size: 12px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 3px 12px; margin: 10px 0 0; font-size: 13px; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.side .kv { grid-template-columns: 6em minmax(0, 1fr); font-size: 12px; }
.side .more { margin: 8px 0 0; }
.side .more .kv { margin-top: 4px; }
/* 能力値（目盛りは css/extella.css の .ranks） */
.ranks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 12px; border: 1px solid var(--line); background: var(--inset); }
.ranks div { border-right: 1px solid rgba(80, 196, 255, .14); border-bottom: 1px solid rgba(80, 196, 255, .14); min-width: 0; }
.ranks div > span { display: block; }
.ranks div b { font-family: var(--en); font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main { min-width: 0; }
.sec { scroll-margin-top: 100px; }
.sec h3 { font: 700 16px/1.4 var(--mincho); color: var(--gold); margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); letter-spacing: .08em; }
.sec:first-child h3 { margin-top: 0; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.item { margin: 0 0 12px; padding: 8px 12px; background: var(--inset); border-left: 2px solid var(--cyan); }
.item .nm { font-weight: 700; overflow-wrap: anywhere; }
.item .nm .rk { font: 700 15px/1 var(--en); color: var(--gold); margin-left: 8px; }
.item .rd { font-size: 12px; color: var(--mute); margin-left: 6px; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0; }
.item .meta span { font-size: 12px; color: var(--ice); background: rgba(62, 230, 255, .08); border: 1px solid rgba(80, 196, 255, .2); padding: 0 6px; overflow-wrap: anywhere; }
.item .meta span small { color: var(--mute); margin-right: 4px; font-size: 11px; }
.item .txt { font-size: 13px; margin-top: 4px; }
.item.np { border-left-color: var(--gold); }
.sub { font-size: 12px; color: var(--mute); margin: 10px 0 6px; }
details { margin: 8px 0; }
summary { cursor: pointer; color: var(--cyan); font-size: 13px; }
details > .txt { margin-top: 6px; }
.voice h4 { font-size: 12px; color: var(--cyan); font-weight: 500; margin: 12px 0 4px; }
.voice p { margin: 0 0 4px; font: 500 13px/1.8 var(--mincho); overflow-wrap: anywhere; padding-left: 10px; border-left: 1px solid rgba(80, 196, 255, .25); }
.rel { margin: 0 0 8px; }
.rel .who { font-weight: 700; }
.rel button.who { background: none; border: 0; padding: 0; color: var(--cyan); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.rel .txt { font-size: 13px; color: var(--ice); }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.nav2 { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
.nav2 .btn { max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; line-height: 22px; }
.none { color: var(--mute); font-size: 13px; }
@media (max-width: 900px) {
  .dgrid { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side { position: static; max-height: none; overflow: visible; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 0 14px; align-items: start; margin-bottom: 18px; }
  .side .pic { grid-row: span 3; }
  .side .cl { margin-top: 0; }
  .side .ranks, .side .kv, .side .more { grid-column: 1 / -1; }
  .side .ranks { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .side .kv { grid-template-columns: 7.5em minmax(0, 1fr); font-size: 13px; }
}
@media (max-width: 820px) {
  .dlg { padding: 0; }
  .sheet { width: 100%; min-height: 100%; margin: 0; padding: 0 16px max(28px, env(safe-area-inset-bottom)); }
  .sheet::before, .sheet::after { display: none; }
  .dbar { margin: 0 -16px 12px; padding: max(8px, env(safe-area-inset-top)) 16px 0; }
  .dbar .nv span { display: none; }
  .dbar .nv { padding: 6px 12px; }
  .bar2 { position: static; background: none; border-bottom: 0; padding-bottom: 0; }   /* 狭い画面では場所を取るので、上に残さない */
}
@media (max-width: 560px) {
  .side { grid-template-columns: 88px minmax(0, 1fr); gap: 0 12px; }
  .side h2 { font-size: 20px; }
  .side .ranks div[data-r] { padding: 3px 2px 8px; text-align: center; }
  .side .ranks div[data-r] b { font-size: 16px; }
  .side .ranks div[data-r]::after { left: 4px; right: 4px; }
  .kv, .side .kv { grid-template-columns: 6.5em minmax(0, 1fr); }
}

</style>

<body>
<script src="js/topnav.js"></script>
<div class="wrap">
  <header>
    <span class="en">Heroic Spirits</span>
    <h1>英霊図鑑</h1>
    <p><a href="submit.html">申請フォーム</a></p>
  </header>
  <p class="note" id="mode" hidden></p>

  <div class="bar2">
    <nav class="tabs" id="tabs" role="tablist" aria-label="クラス"></nav>
    <div class="tools">
      <input type="search" id="q" placeholder="真名・異名・元ネタ・スキル・宝具で探す" autocomplete="off" aria-label="探す">
      <select id="sort" aria-label="並べ方"><option value="class">クラスごと</option><option value="name">名前の順</option><option value="found" id="optFound">発見した順（新しい順）</option></select>
      <select id="sex" aria-label="性別"><option value="">性別：すべて</option><option value="m">男性</option><option value="f">女性</option><option value="x">そのほか</option></select>
      <span class="cnt" id="cnt"></span>
    </div>
  </div>
  <p class="status" id="status">読み込んでいます…</p>
  <p class="hint" id="hint" hidden></p>
  <div id="list"></div>
</div>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="sheet panel" id="sheet"></div>
</div>

<script src="js/config.js"></script>
<script src="js/rank.js"></script>
<script src="js/parser.js"></script>
<script src="js/effects.js"></script>
<script src="js/fgoskills.js"></script>
<script src="js/build.js"></script>
<script src="js/master.js"></script>
<script src="js/war.js"></script>
<script src="js/names.js"></script>
<script src="js/scenes.js"></script>
<script src="js/personas.js"></script>
<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/singdata.js"></script>
<script src="js/singularity.js"></script>
<script>
(function () {
  'use strict';
  const H = window.HGW, B = H.build, ZK = H.data.zukan;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFKC').toLowerCase();
  let roster = [], groups = [], openSv = null;
  const BOSS_KEY = 'boss';
  // 図鑑に載るのは、戦いの中で真名を知った英霊だけ（js/data.js の zukan）。全公開にしていれば全員
  const openAll = ZK.isOpen(), found = ZK.load();
  const seen = sv => openAll || found.has(sv.id);
  // 見ている場所（クラス・検索・並べ方）は、このタブを閉じるまで覚えておく
  const VIEW_KEY = 'hgw.zukan.view';
  const view = { tab: '', q: '', sort: 'class', sex: '' };
  try { const v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || 'null'); if (v && typeof v === 'object') for (const k of Object.keys(view)) if (typeof v[k] === 'string') view[k] = v[k]; } catch (e) { /* 覚えられなくても動く */ }
  const saveView = () => { try { sessionStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch (e) { /* 同上 */ } };

  // ---------- クラスの分け方 ----------
  // CLASS_DEFS の順に並べる。どのクラスにも当たらないもの（Wikiのクラス名のまま）は「その他のクラス」にまとめる
  function grouping() {
    const keys = Object.keys(H.CONFIG.CLASS_DEFS);
    const byKey = new Map();
    for (const sv of roster) { if (sv.bossOnly) continue; const k = keys.includes(sv.class.key) ? sv.class.key : 'extra'; if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(sv); }
    const order = keys.filter(k => k !== 'extra' && byKey.has(k)).concat(byKey.has('extra') ? ['extra'] : []);
    const gs = order.map(k => ({ key: k, label: k === 'extra' ? 'その他のクラス' : H.classDef(k).label, list: byKey.get(k).sort((a, b) => a.trueName.localeCompare(b.trueName, 'ja')) }));
    // ボス専用（特異点のボス）は最後に別枠でまとめる
    const bs = roster.filter(sv => sv.bossOnly).sort((a, b) => a.trueName.localeCompare(b.trueName, 'ja'));
    if (bs.length) gs.push({ key: BOSS_KEY, label: 'ボス専用', list: bs });
    return gs;
  }
  const groupOf = sv => groups.find(g => g.list.includes(sv));

  // ---------- 一覧 ----------
  const nSeen = list => list.filter(seen).length;
  const frac = list => openAll ? String(list.length) : `${nSeen(list)}<small>/${list.length}</small>`;
  function renderTabs() {
    if (view.tab && !groups.some(g => g.key === view.tab)) view.tab = '';
    const all = `<button class="tab" role="tab" data-tab="" aria-selected="${view.tab === ''}">すべて<span class="n">${frac(roster)}</span></button>`;
    $('#tabs').innerHTML = all + groups.map(g => `<button class="tab" role="tab" data-tab="${esc(g.key)}" aria-selected="${view.tab === g.key}"><img src="${H.classIcon(g.key)}" alt="">${esc(g.label)}<span class="n">${frac(g.list)}</span></button>`).join('');
    const cur = $('#tabs [aria-selected="true"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  // 探す文字は、真名・クラス・元ネタ・異名のほか、スキルと宝具の名前（読みも）に当てる
  const hay = new WeakMap();
  const hayOf = sv => { let h = hay.get(sv); if (h == null) { h = norm([sv.trueName, sv.class.label, sv.origin, (sv.aliases || []).join(' '), (sv.classSkills || []).concat(sv.skills || []).map(s => s.name).join(' '), (sv.nps || []).map(n => n.name + ' ' + (n.reading || '')).join(' ')].join(' ')); hay.set(sv, h); } return h; };

  // ---------- 詳しい内容 ----------

  const INFO_KEYS = B.INFO_SHOWN;
  const PROFILE_JA = [['firstPerson', '一人称'], ['secondPerson', '二人称'], ['thirdPerson', '三人称'], ['imageColor', 'イメージカラー'], ['specialty', '特技'], ['likes', '好きなもの'], ['dislikes', '嫌いなもの'], ['nemesis', '天敵'], ['wish', '聖杯への願い']];
  const kv = rows => { const r = rows.filter(([, v]) => v != null && String(v).trim()); return r.length ? `<dl class="kv">${r.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''; };
  const para = t => `<p class="txt">${esc(t)}</p>`;
  // 長い文は最初の部分だけ出して、続きは「続きを読む」で開く（最初の部分は繰り返さない）

  // 前・次：一覧に出ている順。一覧に無い英霊（因縁やリンクから開いた）は、同じクラスの発見済みの中で

  function detail(sv) {

  }
  // kagemiya のページの住所は EUC-JP で書く（index.html の解説と同じ）

  // ---------- 開く・閉じる（住所の # に英霊を書くので、戻るボタンで閉じられ、リンクも送れる） ----------
  const byId = id => roster.find(s => s.id === id);

  $('#q').addEventListener('input', e => { setView('q', e.target.value); renderList(); });

  (async () => {

      else { $('#status').textContent = 'ファイルを直接開いているため、データを読めません。サイトから開いてください。'; return; }
      // ボス専用の英霊（名簿の属性「ボス専用」と bosses.json のボス）は、最後の「ボス専用」枠に載せる
      const SG = H.singularity, bosses = SG.prepareBosses(res.bosses || []).bosses;
      const inList = new Map(res.servants.filter(s => s.bossOnly && s.score).map(s => [s.trueName, s]));
      const boss = bosses.map(x => inList.get(x.trueName) || x);
      const have = new Set(boss.map(x => x.trueName));
      for (const [tn, s] of inList) if (!have.has(tn)) boss.push(s);
      roster = res.servants.filter(s => !s.bossOnly).concat(boss.map(s => (s.bossOnly = true, s)));
    } catch (e) { $('#status').textContent = 'データを読めませんでした：' + e.message; return; }
    if (!roster.length) { $('#status').textContent = '英霊がいません'; return; }
    groups = grouping();
    $('#status').textContent = label; $('#status').hidden = !label;
    // 見え方の案内（発見した英霊だけ／全公開）
    const mode = $('#mode'); mode.hidden = false;
    if (openAll) { mode.className = 'warn'; mode.textContent = '全公開にしています。このページには、すべての英霊の真名と解説が載っています。戦争の中で真名を推し量る楽しみを残したいときは、聖杯戦争の最初の画面の「参戦サーヴァントの設定」で、発見した英霊だけの表示に戻せます。'; }
    else mode.innerHTML = `戦いの中で真名を知った英霊だけが、この図鑑に載ります。いま発見しているのは <b>${nSeen(roster)}</b> / ${roster.length} 騎。すべての英霊を読みたいときは、<a href="index.html">聖杯戦争</a>の最初の画面の「参戦サーヴァントの設定」で全公開に切り替えられます。`;
    if (openAll) { $('#optFound').remove(); if (view.sort === 'found') view.sort = 'class'; }
    if (!['class', 'name', 'found'].includes(view.sort)) view.sort = 'class';
    $('#q').value = view.q; $('#sort').value = view.sort; $('#sex').value = view.sex; if ($('#sex').value !== view.sex) view.sex = '';
    renderTabs(); renderList(); syncHash();
  })();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
