<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英霊図鑑</title>
<meta name="description" content="7分の1の聖杯戦争に登場する英霊を、クラスごとに並べた図鑑。解説・人物・スキル・宝具・因縁・セリフを読める。">
<meta name="theme-color" content="#050d22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 色と書体はゲーム（index.html）・強さランキングにそろえる */
:root {
  --void: #050d22;
  --panel-a: rgba(14, 44, 104, .80); --panel-b: rgba(6, 22, 58, .90); --inset: rgba(3, 14, 38, .72);
  --line: rgba(80, 196, 255, .30); --line-hi: rgba(110, 226, 255, .85);
  --cyan: #3ee6ff; --cyan-2: #8ff4ff; --ice: #e8f7ff; --mute: #8daed4; --gold: #ffd84a; --seal: #ff4f72;
  --sel-ink: #04152e;
  --en: "Rajdhani", "Zen Kaku Gothic New", sans-serif;
  --mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ice); font: 14px/1.7 var(--gothic);
  background:
    repeating-linear-gradient(0deg, rgba(62, 230, 255, .04) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(90deg, rgba(62, 230, 255, .04) 0 1px, transparent 1px 48px),
    radial-gradient(1100px 620px at 78% -8%, #15367a 0%, transparent 62%),
    var(--void);
  background-attachment: fixed;
}
body.dlg-on { overflow: hidden; }
a { color: var(--cyan); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 48px; }
header h1 { font: 700 26px/1.3 var(--mincho); margin: 0; letter-spacing: .06em; }
header .en { font-family: var(--en); letter-spacing: .2em; color: var(--cyan); font-size: 13px; text-transform: uppercase; }
header p { color: var(--mute); margin: 6px 0 0; font-size: 13px; }
.warn { margin: 14px 0; border: 1px solid rgba(255, 79, 114, .5); background: rgba(255, 79, 114, .08); padding: 10px 12px; font-size: 13px; }
.panel { position: relative; background: linear-gradient(180deg, var(--panel-a), var(--panel-b)); border: 1px solid var(--line); padding: 12px 14px; min-width: 0; }
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
.status { color: var(--mute); font-size: 12px; margin: 0 0 8px; }
/* クラスの見出し（狭い画面では横に動かす） */
.tabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 8px; margin: 14px 0 4px; scrollbar-width: thin; }
.tab { flex: none; display: flex; align-items: center; gap: 6px; background: var(--inset); border: 1px solid var(--line); padding: 5px 12px 5px 8px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.tab img { width: 22px; height: 22px; }
.tab .n { font: 600 12px/1 var(--en); color: var(--mute); }
.tab[aria-selected="true"] { background: linear-gradient(90deg, var(--cyan), var(--cyan-2)); color: var(--sel-ink); border-color: var(--cyan); font-weight: 700; }
.tab[aria-selected="true"] .n { color: var(--sel-ink); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
.tools input { flex: 1 1 220px; min-width: 0; background: var(--inset); border: 1px solid var(--line); padding: 7px 10px; }
.tools .cnt { color: var(--mute); font-size: 12px; }
/* 一覧 */
.sec-h { font: 700 17px/1.4 var(--mincho); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; letter-spacing: .06em; }
.sec-h img { width: 26px; height: 26px; }
.sec-h .n { font: 600 13px/1 var(--en); color: var(--mute); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.card { display: flex; align-items: center; gap: 10px; text-align: left; background: linear-gradient(180deg, rgba(14, 44, 104, .55), rgba(6, 22, 58, .75)); border: 1px solid var(--line); padding: 8px 10px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--line-hi); background: linear-gradient(180deg, rgba(30, 70, 140, .7), rgba(8, 30, 74, .85)); }
.card .pic { flex: none; width: 48px; height: 48px; display: grid; place-items: center; background: rgba(3, 14, 38, .8); border: 1px solid rgba(80, 196, 255, .2); overflow: hidden; }
.card .pic img { width: 30px; height: 30px; opacity: .8; }
.card .pic img.face { width: 100%; height: 100%; object-fit: cover; opacity: 1; }
.card .tx { min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.card .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .s { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--mute); padding: 20px 0; }
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; } .card { padding: 6px 8px; gap: 8px; } .card .pic { width: 40px; height: 40px; } header h1 { font-size: 22px; }
  /* 狭い画面では長い真名を2行まで出す */
  .card .t { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; font-size: 13px; }
}
/* 詳しい内容（重ねて開く。狭い画面では全面） */
.dlg { position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-start; justify-content: center; background: rgba(2, 8, 22, .78); padding: 4vh 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.dlg.on { display: flex; }
.dlg .sheet { background: linear-gradient(180deg, #0c2860, #061636); }
.sheet { width: min(860px, 100%); padding: 18px 20px 24px; }
.sheet .close { position: sticky; top: 0; float: right; margin: -6px -8px 0 8px; z-index: 2; background: var(--inset); border: 1px solid var(--line); width: 36px; height: 36px; cursor: pointer; font-size: 18px; line-height: 1; }
.hero { display: flex; gap: 16px; align-items: flex-start; }
.hero .pic { flex: none; width: 120px; height: 120px; display: grid; place-items: center; background: rgba(3, 14, 38, .8); border: 1px solid var(--line); overflow: hidden; }
.hero .pic img { width: 64px; height: 64px; opacity: .85; }
.hero .pic img.face { width: 100%; height: 100%; object-fit: cover; opacity: 1; }
.hero .cl { color: var(--cyan); font-size: 13px; letter-spacing: .1em; }
.hero h2 { font: 700 24px/1.35 var(--mincho); margin: 2px 0 4px; letter-spacing: .04em; overflow-wrap: anywhere; }
.hero .al { color: var(--mute); font-size: 12px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 3px 12px; margin: 10px 0 0; font-size: 13px; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.stl { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin-top: 14px; border: 1px solid var(--line); background: var(--inset); max-width: 480px; }
.stl div { text-align: center; padding: 4px 2px; border-right: 1px solid rgba(80, 196, 255, .14); }
.stl div:last-child { border-right: 0; }
.stl span { display: block; font-size: 11px; color: var(--mute); }
.stl b { font: 700 17px/1.3 var(--en); }
.sheet h3 { font: 700 16px/1.4 var(--mincho); color: var(--gold); margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); letter-spacing: .08em; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.item { margin: 0 0 12px; padding: 8px 12px; background: var(--inset); border-left: 2px solid var(--cyan); }
.item .nm { font-weight: 700; overflow-wrap: anywhere; }
.item .nm .rk { font: 700 15px/1 var(--en); color: var(--gold); margin-left: 8px; }
.item .rd { font-size: 12px; color: var(--mute); margin-left: 6px; }
.item .meta { font-size: 12px; color: var(--mute); margin: 2px 0 4px; overflow-wrap: anywhere; }
.item .txt { font-size: 13px; margin-top: 4px; }
.sub { font-size: 12px; color: var(--mute); margin: 10px 0 6px; }
details { margin: 8px 0; }
summary { cursor: pointer; color: var(--cyan); font-size: 13px; }
details > .txt, details > .voice { margin-top: 6px; }
.voice h4 { font-size: 12px; color: var(--mute); font-weight: 500; margin: 10px 0 2px; }
.voice p { margin: 0 0 4px; font-size: 13px; overflow-wrap: anywhere; }
.rel { margin: 0 0 8px; }
.rel .who { font-weight: 700; }
.rel button.who { background: none; border: 0; padding: 0; color: var(--cyan); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.rel .txt { font-size: 13px; color: var(--ice); }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.btn { --cut: 8px; display: inline-flex; align-items: center; background: linear-gradient(180deg, rgba(20, 60, 130, .9), rgba(8, 30, 74, .95)); border: 0; padding: 6px 14px; min-height: 34px; cursor: pointer; font-size: 13px; color: var(--ice); text-decoration: none;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); box-shadow: inset 0 0 0 1px var(--line-hi); }
.btn:hover { background: linear-gradient(180deg, rgba(40, 100, 180, .95), rgba(12, 44, 100, .95)); }
.nav2 { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
.nav2 .btn { max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; line-height: 22px; }
.none { color: var(--mute); font-size: 13px; }
@media (max-width: 820px) {
  .dlg { padding: 0; }
  .sheet { width: 100%; min-height: 100%; padding: max(14px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .sheet::before, .sheet::after { display: none; }
}
@media (max-width: 560px) {
  .hero { gap: 12px; }
  .hero .pic { width: 84px; height: 84px; }
  .hero h2 { font-size: 20px; }
  .kv { grid-template-columns: 6.5em minmax(0, 1fr); }
  .stl b { font-size: 15px; }
}

/* 画面下の遊び方リンク（聖杯戦争・特異点攻略・英霊図鑑・強さランキング） */
.modenav { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 8px; }
.modenav a, .modenav .cur { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; text-decoration: none; color: var(--ice); line-height: 1.4; text-align: left;
  background: linear-gradient(180deg, rgba(20, 60, 130, .9), rgba(8, 30, 74, .95)); box-shadow: inset 0 0 0 1px var(--line-hi);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.modenav a:hover { background: linear-gradient(180deg, rgba(40, 100, 180, .95), rgba(12, 44, 100, .95)); }
.modenav b { font-size: 14px; }
.modenav small { font-size: 11px; color: var(--mute); }
.modenav .cur { background: linear-gradient(90deg, var(--cyan), var(--cyan-2)); color: var(--sel-ink); }
.modenav .cur small { color: var(--sel-ink); opacity: .75; }
.modenav .spoil b::after { content: "ネタバレ注意"; margin-left: 8px; font-size: 10px; font-weight: 400; color: var(--gold); }
.modenav .cur.spoil b::after { color: var(--sel-ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="en">Heroic Spirits</span>
    <h1>英霊図鑑</h1>
    <p><a href="index.html">← 7分の1の聖杯戦争へ戻る</a></p>
    <p><a href="ranking.html" id="rankLink">強さランキング</a> ・ <a href="singularity.html">特異点攻略</a> ・ <a href="submit.html">申請フォーム</a> ・ <a href="roster.html">サーヴァントリスト</a></p>
  </header>
  <p class="warn">このページには、すべての英霊の真名と解説が載っています。戦争の中で真名を推し量る楽しみを残したいときは、見ないでおいてください。</p>

  <nav class="tabs" id="tabs" role="tablist" aria-label="クラス"></nav>
  <div class="tools">
    <input type="search" id="q" placeholder="真名・異名・元ネタで探す" autocomplete="off" aria-label="探す">
    <span class="cnt" id="cnt"></span>
  </div>
  <p class="status" id="status">読み込んでいます…</p>
  <div id="list"></div>
  <nav class="modenav" aria-label="ほかの遊び方・資料">
    <a class="" href="index.html"><b>7分の1の聖杯戦争</b><small>七騎の戦いを見守る</small></a>
    <a class="" href="singularity.html"><b>特異点攻略</b><small>六騎を率いて敵とボスに挑む（テスト中）</small></a>
    <span class="cur spoil" aria-current="page"><b>英霊図鑑</b><small>解説・スキル・宝具を読む</small></span>
    <a class="spoil" href="ranking.html"><b>強さランキング</b><small>真名・強さ・優勝率を見比べる</small></a>
  </nav>
</div>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="sheet panel" id="sheet"></div>
</div>

<script src="js/config.js"></script>
<script src="js/rank.js"></script>
<script src="js/parser.js"></script>
<script src="js/effects.js"></script>
<script src="js/fgoskills.js"></script>
<script src="js/build.js"></script>
<script src="js/master.js"></script>
<script src="js/war.js"></script>
<script src="js/names.js"></script>
<script src="js/scenes.js"></script>
<script src="js/personas.js"></script>
<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/singdata.js"></script>
<script src="js/singularity.js"></script>
<script>
(function () {
  'use strict';
  const H = window.HGW, B = H.build;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFKC').toLowerCase();
  let roster = [], groups = [], tab = '', openSv = null;
  const BOSS_KEY = 'boss';

  // ---------- クラスの分け方 ----------
  // CLASS_DEFS の順に並べる。どのクラスにも当たらないもの（Wikiのクラス名のまま）は「その他のクラス」にまとめる
  function grouping() {
    const keys = Object.keys(H.CONFIG.CLASS_DEFS);
    const byKey = new Map();
    for (const sv of roster) { if (sv.bossOnly) continue; const k = keys.includes(sv.class.key) ? sv.class.key : 'extra'; if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(sv); }
    const order = keys.filter(k => k !== 'extra' && byKey.has(k)).concat(byKey.has('extra') ? ['extra'] : []);
    const gs = order.map(k => ({ key: k, label: k === 'extra' ? 'その他のクラス' : H.classDef(k).label, list: byKey.get(k).sort((a, b) => a.trueName.localeCompare(b.trueName, 'ja')) }));
    // ボス専用（特異点のボス）は最後に別枠でまとめる
    const bs = roster.filter(sv => sv.bossOnly).sort((a, b) => a.trueName.localeCompare(b.trueName, 'ja'));
    if (bs.length) gs.push({ key: BOSS_KEY, label: 'ボス専用', list: bs });
    return gs;
  }

  // ---------- 一覧 ----------
  function renderTabs() {
    const all = `<button class="tab" role="tab" data-tab="" aria-selected="${tab === ''}">すべて<span class="n">${roster.length}</span></button>`;
    $('#tabs').innerHTML = all + groups.map(g => `<button class="tab" role="tab" data-tab="${esc(g.key)}" aria-selected="${tab === g.key}"><img src="${H.classIcon(g.key)}" alt="">${esc(g.label)}<span class="n">${g.list.length}</span></button>`).join('');
  }
  const matches = (sv, q) => !q || norm([sv.trueName, sv.class.label, sv.origin, (sv.aliases || []).join(' ')].join(' ')).includes(q);
  // クラスの見出しの下ではクラス名を繰り返さない（「その他のクラス」ではWikiのクラス名を出す）
  const card = (sv, g) => `<button class="card" data-id="${esc(sv.id)}"><span class="pic"><img src="${H.classIcon(sv.class.key)}" alt="" data-face="${esc(H.faceNameOf(sv))}"></span>`
    + `<span class="tx"><span class="t" title="${esc(sv.trueName)}">${esc(sv.trueName || '（真名不明）')}</span><span class="s">${esc([g.key === 'extra' || g.key === BOSS_KEY ? sv.class.label : '', sv.origin].filter(Boolean).join('・'))}</span></span></button>`;
  function renderList() {
    const q = norm($('#q').value.trim());
    const gs = groups.filter(g => !tab || g.key === tab).map(g => ({ g, list: g.list.filter(sv => matches(sv, q)) })).filter(x => x.list.length);
    const n = gs.reduce((t, x) => t + x.list.length, 0);
    $('#cnt').textContent = `${n}騎`;
    $('#list').innerHTML = gs.map(({ g, list }) => `<section><h2 class="sec-h"><img src="${H.classIcon(g.key)}" alt="">${esc(g.label)}<span class="n">${list.length}</span></h2><div class="grid">${list.map(sv => card(sv, g)).join('')}</div></section>`).join('')
      || '<p class="empty">当てはまる英霊はいません。</p>';
    watchFaces($('#list'));
  }
  // 顔の画像は見えたものから探す（無い英霊はクラスのアイコンのまま）
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { io.unobserve(e.target); loadFace(e.target); } }, { rootMargin: '200px' }) : null;
  function loadFace(im) {
    const set = u => { im.src = u; im.classList.add('face'); };
    const u = H.faceUrl(im.dataset.face, set); if (u) set(u);
  }
  function watchFaces(root) { root.querySelectorAll('img[data-face]').forEach(im => io ? io.observe(im) : loadFace(im)); }

  // ---------- 詳しい内容 ----------
  // Wikiの【】の項目のうち、プロフィールとして出すもの（TRPG用の能力表や、ゲームでは別に決まるマスターは出さない）
  const INFO_KEYS = B.INFO_SHOWN;
  const PROFILE_JA = [['firstPerson', '一人称'], ['secondPerson', '二人称'], ['thirdPerson', '三人称'], ['imageColor', 'イメージカラー'], ['specialty', '特技'], ['likes', '好きなもの'], ['dislikes', '嫌いなもの'], ['nemesis', '天敵'], ['wish', '聖杯への願い']];
  const kv = rows => { const r = rows.filter(([, v]) => v != null && String(v).trim()); return r.length ? `<dl class="kv">${r.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''; };
  const para = t => `<p class="txt">${esc(t)}</p>`;
  // 長い文は最初の部分だけ出して、続きは「続きを読む」で開く（最初の部分は繰り返さない）
  function longText(text, limit, voice) {
    const l = B.loreLead(text, limit || 400, voice);
    return l.head ? para(l.head) + (l.rest ? `<details><summary>続きを読む</summary>${para(l.rest)}</details>` : '') : '';
  }
  function skillItem(s) {
    return `<div class="item"><div class="nm">${esc(s.name)}${s.rankRaw ? `<span class="rk">${esc(s.rankRaw)}</span>` : ''}</div>${s.desc ? `<p class="txt">${esc(s.desc)}</p>` : ''}</div>`;
  }
  function npItem(n) {
    const meta = [n.rankRaw && 'ランク：' + n.rankRaw, n.typeRaw && '種別：' + n.typeRaw, n.rangeRaw && 'レンジ：' + n.rangeRaw, n.maxRaw && '最大捕捉：' + n.maxRaw].filter(Boolean).join('　');
    return `<div class="item"><div class="nm">『${esc(n.name)}』${n.reading ? `<span class="rd">${esc(n.reading)}</span>` : ''}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}${n.desc ? `<p class="txt">${esc(n.desc)}</p>` : ''}</div>`;
  }
  function weaponItem(w) {
    return `<div class="item"><div class="nm">${esc(w.name)}${w.reading ? `<span class="rd">${esc(w.reading)}</span>` : ''}</div>${w.desc ? `<p class="txt">${esc(w.desc)}</p>` : ''}</div>`;
  }
  // 因縁の相手が図鑑にいれば、押してその英霊を開けるようにする
  const findByName = name => {
    const n = norm(String(name || '').replace(/[（(〔\[【].*?[)）〕\]】]/g, '').trim()); if (!n) return null;
    return roster.find(s => norm(s.trueName) === n) || roster.find(s => (s.aliases || []).some(a => norm(a) === n)) || null;
  };
  function relItem(r) {
    const to = findByName(r.name);
    const who = to && to !== openSv ? `<button class="who" data-id="${esc(to.id)}">${esc(r.name)}</button>` : `<span class="who">${esc(r.name)}</span>`;
    return `<div class="rel">${who}${r.text ? `<p class="txt">${esc(r.text)}</p>` : ''}</div>`;
  }
  // ゲームで使う場面（config.js の VOICE_SLOTS）の見出しだけ出す
  function voiceBlock(voice) {
    const hs = Object.keys(voice || {}).filter(h => (voice[h] || []).length && H.voiceSlotOf(h));
    if (!hs.length) return '';
    return `<h3>セリフ</h3><details><summary>セリフを読む（${hs.length}場面）</summary><div class="voice">${hs.map(h => `<h4>${esc(h)}</h4>${voice[h].map(l => `<p>${esc(l)}</p>`).join('')}`).join('')}</div></details>`;
  }
  function detail(sv) {
    const t = sv.text || {}, p = sv.profile || {}, info = sv.info || {};
    const stats = B.STAT_KEYS.map(k => `<div><span>${esc(B.STAT_JA[k])}</span><b>${esc((sv.stats && sv.stats[k] && sv.stats[k].raw) || '？')}</b></div>`).join('');
    const facts = kv([
      ['元ネタ', sv.origin], ['性別', sv.sex], ['属性', sv.alignment], ['天地人属性', sv.attribute], ['特性', (sv.traits || []).join('、')],
      ...INFO_KEYS.filter(k => info[k] && info[k] !== sv.origin).map(k => [k, info[k]]),
    ]);
    const commentary = longText(t.commentary, 500, sv.voice), person = longText(t.personality, 400, sv.voice);
    const prof = kv(PROFILE_JA.map(([k, l]) => [l, p[k]]));
    const cls = sv.classSkills || [], own = sv.skills || [], nps = sv.nps || [], ws = sv.weapons || [], rels = sv.relations || [];
    const extra = [['comment', 'コメント'], ['other', 'その他']].map(([k, l]) => { const x = B.loreText(t[k], sv.voice); return x ? `<details><summary>${l}</summary>${para(x)}</details>` : ''; }).join('');
    // 同じクラスの中で前後の英霊へ
    const g = groups.find(x => x.list.includes(sv)), i = g ? g.list.indexOf(sv) : -1;
    const prev = g && g.list[i - 1], next = g && g.list[i + 1];
    return `<button class="close" id="dClose" aria-label="閉じる">×</button>
      <div class="hero"><div class="pic"><img src="${H.classIcon(sv.class.key)}" alt="" data-face="${esc(H.faceNameOf(sv))}"></div>
        <div style="min-width:0"><div class="cl">${esc(sv.class.label)}</div><h2 id="dName">${esc(sv.trueName || '（真名不明）')}</h2>${(sv.aliases || []).length ? `<div class="al">${esc(sv.aliases.join('、'))}</div>` : ''}</div></div>
      <div class="stl">${stats}</div>
      ${facts}
      <h3>解説</h3>${commentary || '<p class="none">解説はありません。</p>'}
      ${person || prof ? `<h3>人物・性格</h3>${person}${prof}` : ''}
      ${cls.length || own.length ? `<h3>スキル</h3>${cls.length ? `<div class="sub">クラス別スキル</div>${cls.map(skillItem).join('')}` : ''}${own.length ? `<div class="sub">保有スキル</div>${own.map(skillItem).join('')}` : ''}` : ''}
      <h3>宝具</h3>${nps.length ? nps.map(npItem).join('') : '<p class="none">宝具の記述はありません。</p>'}
      ${ws.length ? `<h3>武装</h3>${ws.map(weaponItem).join('')}` : ''}
      ${rels.length ? `<h3>因縁キャラ</h3>${rels.map(relItem).join('')}` : ''}
      ${voiceBlock(sv.voice)}
      ${extra ? `<h3>そのほかの記述</h3>${extra}` : ''}
      ${links(sv)}
      <div class="nav2">${prev ? `<button class="btn" data-id="${esc(prev.id)}">← ${esc(prev.trueName)}</button>` : '<span></span>'}${next ? `<button class="btn" data-id="${esc(next.id)}">${esc(next.trueName)} →</button>` : '<span></span>'}</div>`;
  }
  // kagemiya のページの住所は EUC-JP で書く（index.html の解説と同じ）
  let eucMap = null;
  function eucEncode(str) {
    if (!eucMap) {
      eucMap = new Map(); const dec = new TextDecoder('euc-jp');
      for (let a = 0xa1; a <= 0xfe; a++) for (let b = 0xa1; b <= 0xfe; b++) { const ch = dec.decode(Uint8Array.of(a, b)); if (ch.length === 1 && ch !== '�' && !eucMap.has(ch)) eucMap.set(ch, [a, b]); }
      for (let b = 0xa1; b <= 0xdf; b++) { const ch = dec.decode(Uint8Array.of(0x8e, b)); if (!eucMap.has(ch)) eucMap.set(ch, [0x8e, b]); }
    }
    let out = '';
    for (const ch of String(str)) {
      const c = ch.codePointAt(0);
      if (c < 0x80) { out += /[A-Za-z0-9\-_.~]/.test(ch) ? ch : '%' + c.toString(16).toUpperCase().padStart(2, '0'); continue; }
      const bs = eucMap.get(ch); if (!bs) return null;
      out += bs.map(x => '%' + x.toString(16).toUpperCase()).join('');
    }
    return out;
  }
  function links(sv) {
    const ls = [];
    if (B.linkOf(sv)) ls.push(`<a class="btn" href="${esc(B.linkOf(sv))}" target="_blank" rel="noopener">設定元リンク</a>`);
    else if (!sv.manual) try { const u = eucEncode(B.pageOf(sv) || sv.trueName); if (u) ls.push(`<a class="btn" href="https://seesaawiki.jp/kagemiya/d/${u}" target="_blank" rel="noopener">設定元リンク</a>`); } catch (e) { /* EUC-JP が使えない環境 */ }
    ls.push(`<a class="btn" href="submit.html?servant=${encodeURIComponent(sv.trueName)}" target="_blank" rel="noopener">この英霊の調整を希望する</a>`);
    return `<div class="links">${ls.join('')}</div>`;
  }

  // ---------- 開く・閉じる（住所の # に英霊を書くので、戻るボタンで閉じられ、リンクも送れる） ----------
  const byId = id => roster.find(s => s.id === id);
  function show(sv) {
    openSv = sv;
    $('#sheet').innerHTML = detail(sv);
    watchFaces($('#sheet'));
    const dlg = $('#dlg');
    dlg.classList.add('on'); document.body.classList.add('dlg-on'); dlg.scrollTop = 0;
    $('#dClose').focus({ preventScroll: true });
  }
  let opener = null, depth = 0;   // depth：図鑑の中で開いた英霊の数（閉じるときにその分だけ戻る）
  function hide() {
    if (!openSv) return;
    const id = openSv.id; openSv = null;
    $('#dlg').classList.remove('on'); document.body.classList.remove('dlg-on');
    const c = opener || $(`#list .card[data-id="${CSS.escape(id)}"]`); opener = null;
    if (c) c.focus({ preventScroll: true });
  }
  const idOfHash = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } };
  function syncHash() { depth = (history.state && history.state.zk) || 0; const sv = byId(idOfHash()); if (sv) show(sv); else hide(); }
  function open(id) { if (idOfHash() === id) syncHash(); else location.hash = encodeURIComponent(id); }
  function close() { if (!openSv) return; if (depth > 0) history.go(-depth); else { history.replaceState(null, '', location.pathname + location.search); hide(); } }
  // 図鑑の中で新しく開いたときだけ、何番目かを覚えておく（戻る・進むのときはそのまま）
  addEventListener('hashchange', () => { if (idOfHash() && !history.state) history.replaceState({ zk: depth + 1 }, ''); syncHash(); });

  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; renderTabs(); renderList(); });
  $('#q').addEventListener('input', renderList);
  $('#list').addEventListener('click', e => { const c = e.target.closest('.card[data-id]'); if (c) { opener = c; open(c.dataset.id); } });
  $('#dlg').addEventListener('click', e => {
    if (e.target.id === 'dlg' || e.target.closest('#dClose')) return close();
    const b = e.target.closest('[data-id]'); if (b) open(b.dataset.id);
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && openSv) close(); });

  // ---------- 読み込み ----------
  (async () => {
    const qs = new URLSearchParams(location.search);
    let label = '';
    try {
      let res;
      if (qs.get('data') === 'local') { res = H.data.loadLocal(); label = 'リストツールで作ったリスト'; $('#rankLink').href = 'ranking.html?data=local'; }
      else if (/^https?:$/.test(location.protocol)) res = await H.data.loadPublished('data/');
      else { $('#status').textContent = 'ファイルを直接開いているため、データを読めません。サイトから開いてください。'; return; }
      // ボス専用の英霊（名簿の属性「ボス専用」と bosses.json のボス）は、最後の「ボス専用」枠に載せる
      const SG = H.singularity, bosses = SG.prepareBosses(res.bosses || []).bosses;
      const inList = new Map(res.servants.filter(s => s.bossOnly && s.score).map(s => [s.trueName, s]));
      const boss = bosses.map(x => inList.get(x.trueName) || x);
      const have = new Set(boss.map(x => x.trueName));
      for (const [tn, s] of inList) if (!have.has(tn)) boss.push(s);
      roster = res.servants.filter(s => !s.bossOnly).concat(boss.map(s => (s.bossOnly = true, s)));
    } catch (e) { $('#status').textContent = 'データを読めませんでした：' + e.message; return; }
    if (!roster.length) { $('#status').textContent = '英霊がいません'; return; }
    groups = grouping();
    $('#status').textContent = label; $('#status').hidden = !label;
    renderTabs(); renderList(); syncHash();
  })();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
